name: Build ICH bootchain (macOS)

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct IPSW URL (optional)'
        required: false
      kpf_set:
        description: 'kpf-set (auto|ios18|...)'
        required: false
        default: auto
  push:
    branches:
      - main
      - add-macos-build-workflow

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: |
          chmod +x ./setup.sh ./build.sh ./boot.sh || true

      - name: Skip if no IPSW for push events
        if: ${{ github.event_name == 'push' }}
        run: |
          if [ -z "${{ github.event.inputs.ipsw_url }}" ]; then
            echo "No IPSW provided for push event — skipping build."
            exit 0
          fi

      - name: Setup Python & install deps
        shell: bash -l {0}
        run: |
          python3 -m venv .gha-venv
          source .gha-venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pyimg4 lzfse pycryptodome || true

          # Provide a minimal ipsw shim so build.sh's 'require ipsw' check passes on CI.
          # This is a no-op shim intended for dry-run CI usage only.
          mkdir -p .gha-tools
          cat > .gha-tools/ipsw <<'BASH'
#!/usr/bin/env bash
# ipsw shim for CI: no-op. build.sh only checks for presence of this command.
exit 0
BASH
          chmod +x .gha-tools/ipsw
          # Add shim directory to PATH for the rest of the job
          echo "${{ github.workspace }}/.gha-tools" >> $GITHUB_PATH

      - name: Run build (dry-run)
        shell: bash -l {0}
        env:
          NR_TOOLS: ${{ github.workspace }}/tools/darwin
        run: |
          source .gha-venv/bin/activate
          set -x
          if [ -n "${{ github.event.inputs.ipsw_url }}" ]; then
            ./build.sh --url "${{ github.event.inputs.ipsw_url }}" --dry-run --kpf-set "${{ github.event.inputs.kpf_set }}"
          else
            ./build.sh --dry-run --kpf-set "${{ github.event.inputs.kpf_set }}"
          fi

      - name: Upload bootchain artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ich-bootchain
          path: |
            bootchain/
            NR_WORK/out-*/
          retention-days: 7
